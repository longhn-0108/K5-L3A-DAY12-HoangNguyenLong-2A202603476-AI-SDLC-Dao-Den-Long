name: Verify Phase

on:
  push:
    branches: [main]
    tags: ["phase-*", "v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run verify
      - run: npm run build
